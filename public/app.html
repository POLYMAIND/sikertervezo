<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F2024">
<meta name="description" content="Napi tervező vállalkozóknak: lépések, kapcsolatok, ügyfelek, tartalom, csapat és célok egy helyen.">
<title>Sikermaker</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/api/manifest" id="manifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" id="appleicon">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sikermaker">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/css/app.css">
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<div class="boot" id="boot"><div class="spinner" role="status" aria-label="Betöltés"></div></div>
<div id="appshell" hidden>
  <div class="app">
    <aside class="side">
      <div class="brandrow" id="brandrow"></div>
      <div class="mtitle" id="mtitle" aria-live="polite"></div>
      <nav class="nav" id="nav" aria-label="Fő menü"></nav>
      <div class="foot" id="foot"></div>
    </aside>
    <main class="main"><div class="wrap" id="view"></div></main>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="Alsó menü"></nav>
  <div class="drawer" id="drawer"></div>
  <div id="layer"></div>
  <div id="celeb"></div>
</div>
<noscript>A Sikermaker használatához engedélyezd a JavaScriptet.</noscript>
<script src="/js/theme.js"></script>
<script src="/js/polyos.js"></script>
<script src="/js/store.js"></script>
<script src="/js/dsimport.js"></script>
<script src="/js/app.js"></script>
<script src="/js/boot.js"></script>
</body>
</html>
