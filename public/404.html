<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F2024">
<meta name="robots" content="noindex">
<title>Ez az oldal nem létezik – Sikermaker</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/css/start.css">
</head>
<body class="nf">
<header class="top scrolled"><div class="in">
  <a class="logo" href="/"><img src="/logo.svg" width="32" height="32" alt=""><span>Sikermaker</span></a>
</div></header>
<main class="nf-main">
  <div class="nf-card">
    <div class="nf-code" aria-hidden="true">4<img src="/logo.svg" width="96" height="96" alt="">4</div>
    <h1>Ezt az oldalt nem találjuk</h1>
    <p>Lehet, hogy elírás van a címben, vagy az oldal közben máshová költözött. Semmi gond: innen egy kattintással visszatalálsz.</p>
    <div class="nf-ctas">
      <a class="btn lg" href="/">Vissza a főoldalra</a>
      <a class="btn lg ghost" href="/app">Megnyitom az appot</a>
    </div>
    <p class="nf-small">Segítség kell? Írj nekünk: <a href="mailto:hello@polymaind.hu">hello@polymaind.hu</a></p>
  </div>
</main>
<style>
.nf{min-height:100vh;display:flex;flex-direction:column}
.nf-main{flex:1;display:grid;place-items:center;padding:40px 16px}
.nf-card{max-width:560px;text-align:center}
.nf-code{display:flex;align-items:center;justify-content:center;gap:10px;font-size:clamp(84px,18vw,140px);font-weight:800;letter-spacing:-.04em;line-height:1;margin-bottom:22px}
.nf-code img{width:.8em;height:.8em;transform:rotate(-8deg);filter:drop-shadow(0 12px 24px rgba(31,32,36,.2))}
.nf h1{font-size:clamp(26px,4vw,36px);margin-bottom:12px}
.nf-card>p{color:var(--muted);font-size:17px;margin:0 auto 28px;max-width:46ch}
.nf-ctas{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.nf-card>p.nf-small{margin:36px auto 0;font-size:14px;color:var(--muted)}
.nf-small a{color:var(--ink);font-weight:600}
@media (max-width:480px){.nf-ctas .btn{flex:1 1 100%}}
</style>
</body>
</html>
