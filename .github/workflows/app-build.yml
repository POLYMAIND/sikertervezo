name: App build

# A natív app (app/ mappa): Android teszt-APK és aláírás nélküli iOS-build. Csak akkor fut, ha az app/ változik.
on:
  push:
    branches: [claude/jolly-wright-4t30sn]
    paths: [app/**, .github/workflows/app-build.yml]
  pull_request:
    paths: [app/**, .github/workflows/app-build.yml]
  workflow_dispatch:

defaults:
  run:
    working-directory: app

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci && npx cap sync android
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: sikermaker-android-debug
          path: app/android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci && npx cap sync ios
      - run: >
          xcodebuild -project ios/App/App.xcodeproj -scheme App
          -sdk iphonesimulator -configuration Debug
          CODE_SIGNING_ALLOWED=NO build
