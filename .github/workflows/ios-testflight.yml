# Sikermaker iOS-app: build és feltöltés a TestFlightra (Mac nélkül). Indítás: Actions → „iOS → TestFlight” → Run workflow,
# vagy egy ios-v* tag (pl. ios-v1.0.0) feltöltése. A szükséges titkok: mobile/fastlane/Fastfile fejléce.
name: iOS → TestFlight

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Verziószám (pl. 1.0.1). Üresen: marad a projektben lévő."
        required: false
  push:
    tags: ["ios-v*"]

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: mobile

      - name: Függőségek, webes tartalom, Capacitor-szinkron
        run: |
          npm ci
          npm test
          npm run sync

      - name: Build + TestFlight
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # verzió: a kézi indításnál megadott, vagy az ios-v1.2.3 tagból 1.2.3; különben marad a projektben lévő
          APP_VERSION="$INPUT_VERSION"
          case "$REF_NAME" in ios-v*) [ -z "$APP_VERSION" ] && APP_VERSION="${REF_NAME#ios-v}";; esac
          export APP_VERSION
          bundle exec fastlane beta

      - name: A build mentése (hiba esetén a naplóhoz)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: |
            mobile/build/*.ipa
            ~/Library/Logs/gym/*.log
          if-no-files-found: ignore
          retention-days: 7
