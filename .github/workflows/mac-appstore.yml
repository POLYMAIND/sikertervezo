# Sikermaker macOS-app: build és feltöltés az App Store Connectbe (Mac), a TestFlightba is.
# Indítás: Actions → „Mac → App Store” → Run workflow. Titkok: ugyanazok, mint az iPhone-buildnél.
name: Mac → App Store

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Verziószám (pl. 1.0.0)"
        required: true
        default: "1.0.0"

concurrency:
  group: mac-appstore
  cancel-in-progress: false

jobs:
  mac:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Webes tartalom
        working-directory: mobile
        run: |
          npm ci
          npm test
          node scripts/build-www.mjs
      - name: XcodeGen
        run: brew install xcodegen
      - name: Build + feltöltés
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          APP_VERSION: ${{ github.event.inputs.version }}
        run: mobile/macos/build-upload.sh
